name: Signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Agent Plugins package
        run: |
          node scripts/validate-package.mjs
          node --test scripts/release.test.mjs

      - name: Build immutable plugin archive
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('plugin.json','utf8')).version)")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match plugin.json version $package_version" >&2
            exit 1
          fi
          tar \
            --exclude='./.git' \
            --exclude='./dist' \
            --exclude='./.DS_Store' \
            --exclude='./release/private-key.pem' \
            --exclude='./release/*private*.pem' \
            -czf "dist/fit-snap-${version}.tar.gz" \
            .
          listing="$(tar -tzf "dist/fit-snap-${version}.tar.gz")"
          if printf '%s\n' "$listing" | grep -Eiq '(^|/)release/[^/]*private[^/]*\.pem$'; then
            echo 'Release archive contains a private key under release/' >&2
            exit 1
          fi
          if printf '%s\n' "$listing" | grep -Eiq '(^|/)private-key\.pem$'; then
            echo 'Release archive contains private-key.pem' >&2
            exit 1
          fi
      - name: Create signed release manifest
        env:
          FITSNAP_RELEASE_PRIVATE_KEY: ${{ secrets.FITSNAP_RELEASE_PRIVATE_KEY }}
          FITSNAP_RELEASE_KEY_ID: fitsnap-ed25519-2026
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/create-release-manifest.mjs \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --artifact "dist/fit-snap-${version}.tar.gz" \
            --output dist/manifest.json
          node scripts/verify-release.mjs \
            --manifest dist/manifest.json \
            --public-key release/public-key.pem \
            --artifact "dist/fit-snap-${version}.tar.gz"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/fit-snap-${version}.tar.gz" \
            dist/manifest.json \
            release/public-key.pem \
            --title "Fit Snap Agent Plugin ${version}" \
            --generate-notes
